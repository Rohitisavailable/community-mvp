# Merge under mcp_servers in the native-Windows default Hermes config.
# This binds the connected default Telegram profile to Project A only.
mcp_servers:
  project_knowledge:
    command: "C:/Users/tfroh/Documents/Codex/2026-10-03/i-wa/outputs/community-mvp/.venv/Scripts/python.exe"
    args:
      - "C:/Users/tfroh/Documents/Codex/2026-10-03/i-wa/outputs/community-mvp/mcp_server.py"
    env:
      PROJECT_KB_DB: "C:/Users/tfroh/Documents/Codex/2026-10-03/i-wa/outputs/community-mvp/data/projects/project-a/knowledge.sqlite3"
      PROJECT_KB_NAME: "Project A"
      OTHER_PROJECT_NAMES: "Project B|Borealis Research Team"
