<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Desk — Demo Recorder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071c25;color:#eef5f2;font:15px/1.45 Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;color:#a8c2c4;font-size:13px;letter-spacing:.09em;text-transform:uppercase}.pill{border:1px solid #31545b;border-radius:999px;padding:6px 11px;color:#9fe0cf}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:14px;box-shadow:0 28px 90px #0008;background:#f5f7f5}footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;color:#a8c2c4}.btn{border:0;border-radius:9px;padding:12px 18px;background:#d66843;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}#status{font-size:14px}small{color:#819b9d}
</style>
</head>
<body><main class="shell"><header><span>Community Desk · prototype walkthrough</span><span class="pill">LOCAL DEMO</span></header><canvas id="screen" width="1280" height="720"></canvas><footer><button class="btn" id="record">Record demo video</button><span id="status">Silent captioned video · uses live Project A/B search results</span><small>Saved to outputs/community-mvp/demo/</small></footer></main>
<script>
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),button=document.querySelector('#record');
const W=1280,H=720, slate='#102f39',teal='#0c4852',orange='#d66843',ink='#18313a',muted='#6c838b',pale='#eef3f1',white='#fff';
let payload={filename:'New Text Document.txt',excerpt:'this is a test code: ABCSDE-DADFE',code:'ABCSDE-DADFE',project_a_matches:2,project_b_matches:0},started=0,recording=false;
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function txt(s,x,y,size=18,color=ink,weight=400,align='left'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px Inter, Segoe UI, Arial`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function wrap(s,x,y,max,size=18,color=ink,weight=400,leading=1.45){ctx.font=`${weight} ${size}px Inter, Segoe UI, Arial`;const words=String(s).split(/\s+/);let line='',yy=y;for(const word of words){const next=line?line+' '+word:word;if(ctx.measureText(next).width>max&&line){txt(line,x,yy,size,color,weight);line=word;yy+=size*leading}else line=next}if(line)txt(line,x,yy,size,color,weight);return yy}
function dot(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function topbar(kicker,title,sub){ctx.fillStyle=pale;ctx.fillRect(0,0,W,H);ctx.fillStyle=slate;ctx.fillRect(0,0,248,H);dot(38,39,17,'#79c5bd');txt('↗',38,45,19,slate,700,'center');txt('Community Desk',68,46,21,white,650);ctx.fillStyle='#34535a';ctx.fillRect(20,75,208,1);txt('TEST PROJECTS',22,108,12,'#9dc4c4',600);txt('Project A',25,147,16,white,700);txt('Hermes · default',25,167,13,'#afc9c9');rr(13,184,218,60,8,'#28515b');txt('Project B',25,211,16,white,700);txt('Hermes · community-project-b',25,231,12,'#afc9c9');txt('ADMIN · LOCAL',25,676,12,'#b6cccc',500);ctx.fillStyle=white;ctx.fillRect(248,0,W-248,82);txt(title,280,42,27,ink,500);txt(sub,281,64,13,muted,400);rr(1162,20,96,37,7,'#e8eeee');txt('New chat',1210,44,13,ink,600,'center');ctx.fillStyle='#d9e1df';ctx.fillRect(248,81,1032,1);if(kicker)txt(kicker,280,106,11,teal,700)}
function cardMessage(x,y,w,h,kind,text,meta){const user=kind==='user';rr(x,y,w,h,11,user?'#244e69':'#e9f0ee');if(!user){ctx.fillStyle=orange;ctx.fillRect(x,y+10,3,h-20)}wrap(text,x+16,y+30,w-32,17,user?white:ink,user?500:450,1.45);txt(meta,x+16,y+h-12,11,user?'#bbd4e4':muted,400)}
function intro(t){ctx.fillStyle='#0d2630';ctx.fillRect(0,0,W,H);for(let i=0;i<9;i++){ctx.strokeStyle=`rgba(107,202,183,${.08+i*.008})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(1010,260,90+i*36,0,Math.PI*2);ctx.stroke()}rr(68,74,150,30,15,'#163d47');txt('LOCAL PROTOTYPE',143,94,12,'#9de0d0',700,'center');txt('Community',68,202,68,white,700);txt('Desk',68,280,68,white,700);ctx.fillStyle=orange;ctx.fillRect(70,315,90,5);wrap('A project-scoped knowledge assistant for community support.',70,370,640,25,'#b5c9c9',400,1.5);txt('Admin dashboard  ·  Local project files  ·  Grounded answers',70,471,16,'#92afaf',500);rr(70,535,376,58,10,'#153c46');dot(96,564,8,'#6ed1b7');txt('Private project knowledge stays in its project',116,570,15,white,550);txt('COMMUNITY DESK',1210,682,12,'#709395',600,'right')}
function dashboard(t){topbar('ADMIN DASHBOARD','Project A','Knowledge support  ·  local prototype');ctx.fillStyle='#f7f9f8';ctx.fillRect(248,82,710,638);ctx.fillStyle='#eef3f1';ctx.fillRect(958,82,322,638);txt('Project files',986,119,20,ink,500);txt('Text files are indexed only inside this project.',986,143,13,muted);txt('ADDED KNOWLEDGE',986,179,11,teal,700);const file=payload.filename||'Uploaded text file';for(let i=0;i<Math.max(1,Math.min(2,payload.project_a_matches));i++){rr(985,194+i*60,268,48,4,white,'#d9e3e0');txt(file,998,215+i*60,13,ink,550);txt('Stored in Project A only',998,232+i*60,11,muted)}rr(985,342,268,78,7,'#e2eeeb');txt('PROJECT SCOPE',1000,365,11,teal,700);wrap('Project A has its own local knowledge database.',1000,388,236,13,ink,450);rr(274,630,660,60,6,white,'#bacac6');txt('Ask about this project’s files…',294,666,15,muted);rr(943,640,74,44,6,orange);txt('Ask',980,668,15,white,650,'center');dot(600,330,16,'#0d8990');dot(600,330,10,white);txt('Ask this project',600,393,27,ink,500,'center');txt('Answers are grounded in the selected project’s files.',600,425,15,muted,400,'center');const glow=Math.max(0,Math.sin(t*3))*0.3;rr(270,625,672,69,8,null,`rgba(13,137,144,${.4+glow})`)}
function qa(t){topbar('GROUNDED ANSWER','Project A','Knowledge support  ·  local prototype');ctx.fillStyle='#f8faf9';ctx.fillRect(248,82,710,638);ctx.fillStyle='#eef3f1';ctx.fillRect(958,82,322,638);txt('Project files',986,119,20,ink,500);rr(985,145,268,49,4,white,'#d9e3e0');txt(payload.filename||'Uploaded text file',998,166,13,ink,550);txt('Stored in Project A only',998,183,11,muted);txt('Hermes profile mapping',986,231,16,ink,500);wrap('The dashboard chooses a project-specific knowledge scope.',986,254,258,13,muted,400);cardMessage(326,164,534,60,'user',`What is the test code ${payload.code||'in my uploaded file'}?`,'YOU  ·  10:14 AM');const chars=Math.min((t-1.8)*44,82);const answer=`The code in your uploaded file is ${payload.code||'shown in the source excerpt'}.`;cardMessage(326,248,555,130,'agent',answer,`${payload.filename||'Uploaded text file'}  ·  project-scoped local search`);rr(326,397,555,92,8,'#fff','#d9e3e0');txt('SOURCE EXCERPT',344,422,11,teal,700);wrap(payload.excerpt||'Uploaded file excerpt retrieved from Project A.',344,448,505,16,ink,450);rr(326,515,555,44,7,'#e1efeb');dot(347,537,6,'#22977c');txt('Answer supported by Project A file',362,542,13,'#26685d',600);txt('LOCAL INDEX',880,568,10,teal,700,'right');if(chars<12)ctx.fillStyle='rgba(255,255,255,.75)'}
function isolated(t){topbar('ISOLATION CHECK','Project B','Knowledge support  ·  local prototype');ctx.fillStyle='#f8faf9';ctx.fillRect(248,82,710,638);ctx.fillStyle='#eef3f1';ctx.fillRect(958,82,322,638);txt('Project files',986,119,20,ink,500);rr(985,145,268,49,4,white,'#d9e3e0');txt('Project B knowledge files',998,166,13,ink,550);txt('A separate project scope',998,183,11,muted);cardMessage(326,164,534,60,'user',`What is the test code ${payload.code||'from Project A'}?`,'YOU  ·  10:15 AM');cardMessage(326,248,555,106,'agent','I couldn’t find that in this project’s files.','Project B  ·  no matching source');rr(326,384,555,105,8,'#e1efeb');txt('ISOLATION RESULT',344,411,11,teal,700);wrap('Project B search returned no match for the code stored in Project A.',344,438,506,16,ink,450);txt('Project A files',360,528,15,ink,650);txt('Only Project A database',360,552,12,muted);txt('Project B files',672,528,15,ink,650);txt('Only Project B database',672,552,12,muted);ctx.strokeStyle='#7cbcaf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(514,530);ctx.lineTo(637,530);ctx.stroke();dot(514,530,5,'#22977c');dot(637,530,5,'#22977c')}
function architecture(){ctx.fillStyle='#0d2630';ctx.fillRect(0,0,W,H);txt('HOW THE PROTOTYPE WORKS',72,103,13,'#95d9c8',700);txt('A small, local-first flow',72,163,38,white,650);wrap('Separate project storage keeps the answer grounded in the selected project.',72,207,690,19,'#b6caca',400);const xs=[72,358,644,930],labels=[['ADMIN DASHBOARD','Projects + files'],['PROJECT SEARCH','Scoped SQLite index'],['HERMES AGENT','Configured chat route'],['LOCAL FALLBACK','Ollama / excerpt']];for(let i=0;i<4;i++){rr(xs[i],327,230,134,12,'#173d47','#32636a');txt(`0${i+1}`,xs[i]+20,359,12,'#80cbbd',700);txt(labels[i][0],xs[i]+20,399,14,white,650);txt(labels[i][1],xs[i]+20,429,13,'#b3caca',400);if(i<3){ctx.strokeStyle='#73cbb9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xs[i]+237,394);ctx.lineTo(xs[i+1]-10,394);ctx.stroke();dot(xs[i+1]-10,394,4,'#73cbb9')}}rr(72,535,1088,76,9,'#173b43');txt('Backend honesty',96,566,14,'#94d9c9',650);wrap('The live dashboard labels whether Hermes, Ollama, or the local retrieval fallback returned each answer.',250,566,875,15,white,450);txt('COMMUNITY DESK  ·  LOCAL PROTOTYPE',1208,682,12,'#7da0a0',550,'right')}
function closing(){ctx.fillStyle=slate;ctx.fillRect(0,0,W,H);dot(116,130,28,'#76c4b7');txt('✓',116,139,27,slate,700,'center');txt('Project knowledge,',70,263,52,white,650);txt('kept in its lane.',70,324,52,white,650);ctx.fillStyle=orange;ctx.fillRect(74,352,88,4);wrap('A working local prototype: Admin login, project files, grounded Q&A, and a visible separation check.',74,413,770,21,'#b8cece',400,1.55);txt('NEXT  ·  Validate the Hermes profile route and Telegram response live',74,571,15,'#95d9c9',550);txt('END OF DEMO',1207,676,12,'#7da0a0',600,'right')}
const scenes=[{start:0,end:5,draw:intro},{start:5,end:11,draw:dashboard},{start:11,end:19,draw:qa},{start:19,end:26,draw:isolated},{start:26,end:32,draw:architecture},{start:32,end:38,draw:closing}];
function frame(now){if(!recording)return;const t=(now-started)/1000;ctx.clearRect(0,0,W,H);const scene=scenes.find(s=>t>=s.start&&t<s.end)||scenes[scenes.length-1];scene.draw(t-scene.start);if(t<38)requestAnimationFrame(frame);else recorder.stop()}
let recorder;
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Loading the real Project A and Project B search results…';try{payload=await (await fetch('/data.json')).json()}catch(e){status.textContent='Could not read the local project index.';button.disabled=false;return}const stream=canvas.captureStream(30),type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!type){status.textContent='This browser does not support WebM recording.';button.disabled=false;return}const chunks=[];recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:2200000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());status.textContent='Rendering complete. Saving video locally…';const blob=new Blob(chunks,{type:'video/webm'});try{const res=await fetch('/save',{method:'POST',headers:{'Content-Type':'video/webm'},body:blob});if(!res.ok)throw new Error(await res.text());const result=await res.json();status.textContent=`Video saved · ${(result.bytes/1048576).toFixed(1)} MB · ${result.path}`}catch(e){status.textContent='Video capture finished, but local save failed: '+e.message}button.textContent='Video ready';};started=performance.now();recording=true;status.textContent='Recording 38-second demo video…';recorder.start(500);requestAnimationFrame(frame)});
// Provide a polished still frame while waiting to record.
intro(0);
</script></body></html>
